name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh

      - name: Run lint
        run: ./scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh

      - name: Run application tests
        run: ./tests/test.sh

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh

      - name: Build and smoke test Docker image
        run: ./scripts/build.sh
